<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amazon Navbar</title>
    <link rel="stylesheet" href="navbar.css" />
  </head>
  <body>
    <header class="amazon-navbar">
      <div class="nav-top">
        <div class="nav-logo">
          <a href="#">amazon<span>.in</span></a>
          <div class="logo-smile"></div>
        </div>
        <div class="search-container">
          <div class="search-all">
            <span>All</span>
            <span class="down-arrow">▼</span>
          </div>
          <input type="text" placeholder="Search Amazon.in" />
          <button class="search-button">
            <span class="search-icon"></span>
          </button>
        </div>
        <div class="nav-account">
          <span>Hello, sign in</span>
          <strong> Account &amp; Lists </strong>
          <span class="small-arrow">▼</span>
        </div>
        <div class="nav-orders">
          <span>Returns</span>
          <strong> &amp; Orders </strong>
        </div>
        <div class="nav-cart">
          <div class="cart-icon">
            <span class="cart-count">0</span>
            🛒
          </div>
          <strong>Cart</strong>
        </div>
      </div>
      <div class="nav-bottom">
        <div class="nav-all">
          <span class="hamburger">☰</span>
          <strong>All</strong>
        </div>
        <a href="#">Fresh <span>▼</span></a>
        <a href="#">Prime Video</a>
        <a href="#">Sell</a>
        <a href="#">Bestsellers</a>
        <a href="#">Today's Deals</a>
        <a href="#">Customer Service</a>
        <a href="#">Mobiles</a>
        <a href="#">New Releases</a>
        <a href="#">Prime <span>▼</span></a>
        <a href="#">Amazon Pay</a>
        <a href="#">Electronics</a>
      </div>
    </header>
  </body>
</html>
