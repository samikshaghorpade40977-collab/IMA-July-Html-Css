<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><Shopping-Cart></Shopping-Cart></title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">
    <header class="header">
        <button class="back-btn" aria-label="Go back">
            <span></span>
        </button>
        <div class="bag-title">
            <h1>Bag</h1>
            <span>1 item</span>
        </div>
        <a href="#" class="wishlist">View Wishlist</a>
    </header>
    <main class="content">
        <section class="product-card">
            <div class="product-image-wrap">
                <img src="https://images-static.nykaa.com/media/catalog/product/f/e/fef94e88904386118347_1.jpg"
                     alt="MARS Cosmetics Eyes On Fire Eye Makeup Gift Set"
                     class="product-image">
            </div>
            <div class="product-info">
                <h2>
                    MARS Cosmetics Eyes On Fire Eye
                    Makeup Gift Set - Pack Of 4
                </h2>
                <p class="weight">24.9g</p>
                <div class="quantity">
                    <span>Quantity : 1</span>
                    <span class="down-arrow"></span>
                </div>
            </div>
<div class="product-price">
                <span class="pay-label">You Pay</span>
                <div class="price">
                    <strong>₹613</strong>
                    <del>₹816</del>
                    <span class="discount">25% off</span>
                </div>
            </div>
</body>
</html>
